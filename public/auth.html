<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
   
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- ✅ ADD THIS CSS -->
    <style>
        .input-group {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            display: none; /* hidden by default */
        }

        .input-group:focus-within .toggle-password {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container" id="container">

        <div class="welcome-panel">

            <div class="welcome-content sign-in-text">
                <h2> Hello, Welcome!</h2>
                <p>Don't have an account?</p>
                <button class="toggle-btn" id="signUpBtn">Register</button>
            </div>
            <div class="welcome-content sign-up-text">
                <h2>Welcome Back!</h2>
                <p>Already have an account?</p>
                <button class="toggle-btn" id="signInBtn">Login</button>
            </div>

        </div>

        <div class="form-panel">

            <!-- LOGIN -->
            <div class="form-content sign-in-form">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" placeholder="Email ID" required>
                        <i class="fas fa-user icon"></i>
                    </div>
                    
                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                        <i class="fas fa-lock icon"></i>

                        <!-- 👁 ADD THIS -->
                        <i class="fas fa-eye toggle-password"></i>
                    </div>

                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe" style="font-size:14px;">Remember Me</label>
                    </div>

                    <a href="forgot-password.html" class="forgot-password">Forget Password?</a>
                    <button type="submit" class="submit-btn login-btn">Login</button>
                </form>

                <div class="social-login-section">
                    <p>or login with social platforms</p>
                    
                    <div class="social-icons">
                        <a href="https://accounts.google.com" target="_blank"><i class="fab fa-google"></i></a>
                        <a href="https://facebook.com/your-profile" target="_blank"><i class="fab fa-facebook"></i></a>
                        <a href="https://github.com/sharma903" target="_blank"><i class="fab fa-github"></i></a>
                        <a href="https://linkedin.com/in/nihalsharma2005" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>

            <!-- REGISTER -->
            <div class="form-content sign-up-form">
                <h2>Register</h2>
                <form id="registerForm">
                    <div class="input-group">
                        <input type="text" name="name" placeholder="Full Name" required>
                        <i class="fas fa-envelope icon"></i>
                    </div>

                    <div class="input-group">
                        <input type="text" name="email" placeholder="Email ID" required>
                        <i class="fas fa-envelope icon"></i>
                    </div>

                    <div class="input-group">
                        <input type="password" name="password" placeholder="Password" required>
                        <i class="fas fa-lock icon"></i>

                        <!-- 👁 ADD THIS -->
                        <i class="fas fa-eye toggle-password"></i>
                    </div>

                    <div class="strength">
                        <div id="strengthBar"></div>
                    </div>
                    <p id="strengthText" style="font-size:13px;"></p>

                    <button type="submit" class="submit-btn login-btn" style="margin-top: 15px;">
                        Sign Up
                    </button>
                </form>

                <p id="registerMsg" style="margin-top:10px; font-size:14px;"></p>

                <div class="social-login-section">
                    <p>or register with social platforms</p>
                    <div class="social-icons">
                        <a href="https://accounts.google.com" target="_blank"><i class="fab fa-google"></i></a>
                        <a href="https://facebook.com/your-profile" target="_blank"><i class="fab fa-facebook"></i></a>
                        <a href="https://github.com/sharma903" target="_blank"><i class="fab fa-github"></i></a>
                        <a href="https://linkedin.com/in/nihalsharma2005" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <p id="formMsg"></p>

    <script src="script.js"></script>

   

</body>
</html>
