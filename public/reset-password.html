<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>
<link rel="icon" type="image/png" href="logo.png">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>

/* BACKGROUND */

*{
    box-sizing: border-box;

}


body {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
}

/* CONTAINER */
.container {
    background: rgba(255,255,255,0.95);
    width: 420px;
    border-radius: 20px;
    padding: 45px 30px;
    overflow: hidden;
    text-align: center;

    backdrop-filter: blur(10px);

    box-shadow: 
        0 25px 60px rgba(0,0,0,0.25),
        inset 0 3px 6px rgba(255,255,255,0.6);

    transition: all 0.3s ease;
}

/* HOVER BORDER GLOW */
.container:hover {
    transform: translateY(-5px);
    box-shadow: 
        0 0 0 2px rgba(102,126,234,0.6),
        0 0 25px rgba(118,75,162,0.4),
        0 25px 60px rgba(0,0,0,0.3);
}

/* TITLE */
h2 {
    margin-bottom: 30px;
    color: #1f2937;
}

/* INPUT GROUP */
.input-group {
    position: relative;
    width: 100%;
    margin-bottom: 25px;
}

/* INPUT */
.input-group input {
    width: 100%;
    padding: 16px 45px 16px 15px;
    border-radius: 12px;
    max-width: 100%;
    display: block;
    border: none;
    outline: none;
    font-size: 14px;

    background: #f1f5f9;

    box-shadow: 
        inset 4px 4px 10px rgba(0,0,0,0.08),
        inset -4px -4px 10px rgba(255,255,255,0.9);

    transition: all 0.3s ease;
}

/* FOCUS EFFECT */
.input-group input:focus {
    background: #fff;
    box-shadow: 
        0 0 0 2px rgba(118,75,162,0.3),
        0 8px 20px rgba(118,75,162,0.15);
}

/* FLOAT LABEL EFFECT */
.input-group input::placeholder {
    transition: 0.3s;
}

.input-group input:focus::placeholder {
    opacity: 0.5;
}

/* ICON */
.toggle-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #6b7280;
    transition: 0.3s;
}

.toggle-icon:hover {
    color: #764ba2;
}

/* PASSWORD STRENGTH BAR */
.strength {
    height: 8px;
    border-radius: 10px;
    background: #e5e7eb;
    overflow: hidden;
    margin-bottom: 8px;
}

.strength-bar {
    height: 100%;
    width: 0%;
    transition: all 0.4s ease;
    border-radius: 10px;
}

/* TEXT */
.strength-text {
    font-size: 13px;
    margin-bottom: 15px;
    color: #6b7280;
}

/* BUTTON */
button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: 600;
    cursor: pointer;

    background: linear-gradient(135deg, #667eea, #764ba2);

    box-shadow: 
        0 10px 25px rgba(118, 75, 162, 0.35);

    transition: all 0.3s ease;
}

/* BUTTON HOVER */
button:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 
        0 15px 30px rgba(118,75,162,0.45);
}

/* SHAKE */
.shake {
    animation: shake 0.4s;
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-6px); }
    100% { transform: translateX(0); }
}

</style>
</head>

<body>

<div class="container" id="box">

    <h2>Reset Password</h2>

    <form id="resetForm">

        <!-- PASSWORD -->
        <div class="input-group">
            <input type="password" id="password" placeholder="New Password" required>
            <i class="fas fa-eye toggle-icon" onclick="togglePassword('password', this)"></i>
        </div>

        <!-- STRENGTH -->
        <div class="strength">
            <div class="strength-bar" id="strengthBar"></div>
        </div>
        <div class="strength-text" id="strengthText">Password strength</div>

        <!-- CONFIRM -->
        <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            <i class="fas fa-eye toggle-icon" onclick="togglePassword('confirmPassword', this)"></i>
        </div>

        <button>Update Password</button>

    </form>

</div>

<script>


document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = localStorage.getItem("resetEmail");
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    

    // ✅ Check match
    if (password !== confirmPassword) {
        alert("❌ Passwords do not match");
        return;
    }

    try {
        const res = await fetch("http://localhost:5000/api/auth/reset-password", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
            // ✅ Redirect to success page
            window.location.href = "auth.html";
        } else {
            alert("❌ " + data.error);
        }

    } catch (err) {
        console.error(err);
        alert("❌ Server error");
    }
});

// PASSWORD STRENGTH & TOGGLE
document.addEventListener("DOMContentLoaded", () => {
    const passwordInput = document.getElementById("password");
    const strengthBar = document.getElementById("strengthBar");
    const strengthText = document.getElementById("strengthText");

    if (!passwordInput) return;

    passwordInput.addEventListener("input", () => {
        const value = passwordInput.value;
        let strength = 0;

        if (value.length >= 6) strength++;
        if (/[A-Z]/.test(value)) strength++;
        if (/[0-9]/.test(value)) strength++;
        if (/[!@#$%^&*]/.test(value)) strength++;

        if (strength <= 1) {
            strengthBar.style.width = "30%";
            strengthBar.style.background = "red";
            strengthText.innerText = "Weak Password";
        } 
        else if (strength === 2 || strength === 3) {
            strengthBar.style.width = "70%";
            strengthBar.style.background = "orange";
            strengthText.innerText = "Medium Password";
        } 
        else {
            strengthBar.style.width = "100%";
            strengthBar.style.background = "green";
            strengthText.innerText = "Strong Password";
        }
    });
});

function togglePassword(id, icon) {
    const input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}

    }
}

</script>
</body>
</html>
