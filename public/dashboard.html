<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fraud Monitoring Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 30px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
}

.logo {
    font-size: 20px;
    font-weight: 600;
}

.user {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    background: #2563eb;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logout {
    background: transparent;
    border: 1px solid #ef4444;
    color: #ef4444;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
}

/* CONTAINER */
.container {
    padding: 20px 40px;
}

/* STATS */
.stats {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.card {
    flex: 1;
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.red { border-left: 4px solid #ef4444; }
.green { border-left: 4px solid #22c55e; }
.blue { border-left: 4px solid #3b82f6; }

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}

.panel {
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
}

/* INPUT */
input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: white;
}

button.primary {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    cursor: pointer;
}

/* RESULT */
.safe { color: #22c55e; }
.fraud { color: #ef4444; font-weight: bold; }

/* TABLE */
table {
    width: 100%;
    margin-top: 10px;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    text-align: center;
}

ul {
    margin-top: 10px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">💳 FinTech Fraud System</div>

    <div class="user" id="userBox"></div>
</div>

<div class="container">

    <!-- STATS -->
    <div class="stats">
        <div class="card red">
            <h4>Fraud Alerts</h4>
            <p id="fraudCount">0</p>
        </div>

        <div class="card green">
            <h4>Total Transactions</h4>
            <p id="totalTx">0</p>
        </div>

        <div class="card blue">
            <h4>Detection Rate</h4>
            <p id="rate">0%</p>
        </div>
    </div>

    <!-- GRID -->
    <div class="grid">

        <!-- FORM -->
        <div class="panel">
            <h3>Analyze Transaction</h3>

            <input type="number" id="amount" placeholder="Amount">
            <input type="text" id="location" placeholder="Location">
            <input type="date" id="date">
            <input type="time" id="time">

            <button class="primary" onclick="checkFraud()">Check Fraud</button>
        </div>

        <!-- RESULT -->
        <div class="panel">
            <h3>Result</h3>
            <p id="result">No analysis yet</p>
        </div>

        <!-- ALERTS -->
        <div class="panel">
            <h3>Live Alerts</h3>
            <ul id="alerts"></ul>
        </div>

        <!-- HISTORY -->
        <div class="panel">
            <h3>Transaction History</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Location</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="historyTable"></tbody>
            </table>
        </div>

    </div>

</div>

<script>
let fraudCount = 0;
let totalTx = 0;

document.addEventListener("DOMContentLoaded", async () => {

    const user = JSON.parse(localStorage.getItem("user"));
    const token = localStorage.getItem("token") || sessionStorage.getItem("token");

    if (!token || !user) {
        window.location.href = "auth.html";
        return;
    }

    // USER UI
    document.getElementById("userBox").innerHTML = `
        <div class="avatar">${user.name.charAt(0)}</div>
        <span>${user.name}</span>
        <button class="logout" onclick="logout()">Logout</button>
    `;

    try {
        const res = await fetch("http://localhost:5000/api/auth/profile", {
            headers: { "Authorization": "Bearer " + token }
        });

        if (res.status === 401) logout();

    } catch {
        logout();
    }
});

function logout() {
    localStorage.clear();
    sessionStorage.clear();
    window.location.href = "index.html";
}

async function checkFraud() {

    const token = localStorage.getItem("token");

    const amount = document.getElementById("amount").value;
    const location = document.getElementById("location").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    if (!amount || !location || !date || !time) {
        alert("Fill all fields");
        return;
    }

    const res = await fetch("http://localhost:5000/api/fraud/check", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ amount, location, date, time })
    });

    const data = await res.json();

    totalTx++;

    let status = data.isFraud ? "⚠️ Fraud" : "✅ Safe";
    let cls = data.isFraud ? "fraud" : "safe";

    if (data.isFraud) {
        fraudCount++;
        document.getElementById("alerts").innerHTML +=
            `<li>🚨 ₹${amount} - ${location}</li>`;
    }

    document.getElementById("fraudCount").innerText = fraudCount;
    document.getElementById("totalTx").innerText = totalTx;
    document.getElementById("rate").innerText =
        ((fraudCount / totalTx) * 100).toFixed(1) + "%";

    document.getElementById("result").innerHTML =
        `<span class="${cls}">${status}</span>`;

    document.getElementById("historyTable").innerHTML += `
        <tr>
            <td>${date}</td>
            <td>${location}</td>
            <td>₹${amount}</td>
            <td class="${cls}">${status}</td>
        </tr>
    `;
}
</script>

</body>
</html>
